limit_req_zone $binary_remote_addr zone=jarvis_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=jarvis_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name jarvis.187-77-181-3.nip.io;

    client_max_body_size 8m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /v1/session {
        limit_req zone=jarvis_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        limit_req zone=jarvis_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;
    }
}
